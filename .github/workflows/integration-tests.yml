name: Supabase Integration Tests

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  supabase-question-state:
    # GitHub does not provide repository secrets to pull requests from forks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      SUPABASE_INTEGRATION_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_INTEGRATION_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Check test database configuration
        run: |
          test -n "$SUPABASE_INTEGRATION_URL" || { echo "::error::Set the SUPABASE_URL Actions variable."; exit 1; }
          test -n "$SUPABASE_INTEGRATION_SERVICE_ROLE_KEY" || { echo "::error::Set the SUPABASE_SERVICE_ROLE_KEY Actions secret."; exit 1; }

      - name: Test durable question callback state
        run: npm run test:integration
